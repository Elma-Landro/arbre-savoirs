<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"><title>Métal incandescent enluminé</title>
  <defs>
    <filter id="grain" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="52"/>
      <feDisplacementMap in="SourceGraphic" scale="1.8"/>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#6B3A2A" flood-opacity="0.38"/>
    </filter>
    <radialGradient id="fireGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#D4A017"/>
      <stop offset="0.52" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5EDD6"/>
      <stop offset="0.45" stop-color="#5A6472"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4A017"/>
      <stop offset="0.35" stop-color="#6B3A2A"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="goldRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4A017"/>
      <stop offset="0.65" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#6B3A2A"/>
    </linearGradient>
  </defs>


  <g filter="url(#shadow)" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 101 C64 73 131 73 161 99 C151 129 74 139 40 101 Z" fill="#D4A017" opacity="0.28" stroke="none"/>
    <path filter="url(#grain)" d="M46 99 C75 73 126 72 156 96 C145 119 75 126 46 99 Z" fill="url(#fireGlow)"/>
    <path d="M63 94 C83 83 115 83 139 96" fill="none" stroke="#D4A017" stroke-width="5"/>
    <path d="M74 109 C94 118 120 112 139 104" fill="none" stroke="#F5EDD6" stroke-width="2" opacity="0.65"/>
    <circle cx="59" cy="76" r="4" fill="#D4A017"/><circle cx="149" cy="82" r="3" fill="#C0392B"/>
  </g>
</svg>
