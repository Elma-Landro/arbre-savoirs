<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"><title>Planches illustrées</title>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="3" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#5C3A21" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="woodWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D99A2B"/>
      <stop offset=".65" stop-color="#B35435"/>
      <stop offset="1" stop-color="#5C3A21"/>
    </linearGradient>
    <linearGradient id="leafy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4F3B"/>
      <stop offset="1" stop-color="#D99A2B" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="steelSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EFE6"/>
      <stop offset=".5" stop-color="#6B7280"/>
      <stop offset="1" stop-color="#5C3A21"/>
    </linearGradient>
  </defs>

  <g filter="url(#softShadow)">
    <g filter="url(#grain)" stroke="#5C3A21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M39 78 C71 68 112 62 160 57 C168 56 175 61 176 70 L177 89 C133 98 87 105 40 115 C34 104 32 90 39 78 Z" fill="url(#woodWarm)"/>
      <path d="M31 112 C75 102 121 95 174 90 C181 101 181 115 176 127 C127 134 82 144 40 156 C31 145 27 127 31 112 Z" fill="#D99A2B"/>
      <path d="M52 89 C83 81 123 78 159 72 M51 128 C86 118 127 113 165 107" fill="none" opacity=".55"/>
      <path d="M66 81 C75 89 74 102 64 111 M122 69 C130 78 131 89 123 98 M84 122 C93 130 92 142 81 151 M144 110 C151 117 151 127 143 135" fill="none" opacity=".42"/>
      <circle cx="50" cy="92" r="3" fill="#5C3A21" opacity=".55"/><circle cx="153" cy="112" r="3" fill="#5C3A21" opacity=".55"/>
    </g>
  </g>
</svg>