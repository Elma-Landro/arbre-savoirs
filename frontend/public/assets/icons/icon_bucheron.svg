<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"><title>Icône bûcheron</title>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="3" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#5C3A21" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="woodWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D99A2B"/>
      <stop offset=".65" stop-color="#B35435"/>
      <stop offset="1" stop-color="#5C3A21"/>
    </linearGradient>
    <linearGradient id="leafy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4F3B"/>
      <stop offset="1" stop-color="#D99A2B" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="steelSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EFE6"/>
      <stop offset=".5" stop-color="#6B7280"/>
      <stop offset="1" stop-color="#5C3A21"/>
    </linearGradient>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M100 24 C132 33 160 53 173 85 C184 114 176 147 151 168 C125 189 84 188 55 168 C28 149 17 116 27 86 C38 54 66 33 100 24 Z" fill="#F4EFE6" stroke="#5C3A21" stroke-width="3"/>
    <g filter="url(#grain)" stroke="#5C3A21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 122 C79 112 118 108 145 116 C139 139 117 153 91 149 C72 146 60 136 58 122 Z" fill="#F4EFE6" stroke-width="2.2"/>
      <path d="M78 120 C86 105 117 103 126 119 C134 135 110 142 92 137 C81 134 73 127 78 120 Z" fill="url(#woodWarm)"/>
      <path d="M93 55 C119 42 147 48 160 67 C143 84 120 88 101 77 C95 68 92 62 93 55 Z" fill="url(#steelSoft)"/>
      <path d="M72 63 C81 57 91 58 98 66 C114 88 130 121 141 146" fill="none" stroke-width="7"/>
      <path d="M55 79 C72 50 104 39 137 49 C118 59 100 78 93 102 C82 88 69 80 55 79 Z" fill="#2E4F3B" opacity=".92"/>
    </g>
  </g>
</svg>