<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"><title>Enclume enluminée</title>
  <defs>
    <filter id="grain" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="52"/>
      <feDisplacementMap in="SourceGraphic" scale="1.8"/>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#6B3A2A" flood-opacity="0.38"/>
    </filter>
    <radialGradient id="fireGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#D4A017"/>
      <stop offset="0.52" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5EDD6"/>
      <stop offset="0.45" stop-color="#5A6472"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4A017"/>
      <stop offset="0.35" stop-color="#6B3A2A"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="goldRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4A017"/>
      <stop offset="0.65" stop-color="#C0392B"/>
      <stop offset="1" stop-color="#6B3A2A"/>
    </linearGradient>
  </defs>


  <g filter="url(#shadow)" stroke="#1A1A1A" stroke-width="3.5" stroke-linejoin="round">
    <path filter="url(#grain)" d="M39 76 C68 70 108 70 135 75 C149 71 161 61 173 49 C175 66 168 82 149 93 C143 101 142 113 144 126 L111 126 L106 148 L73 148 L82 126 L52 126 C55 108 51 94 39 76 Z" fill="url(#steel)"/>
    <path d="M62 126 L136 126 L148 157 L50 157 Z" fill="#5A6472"/>
    <circle cx="102" cy="105" r="13" fill="#D4A017" stroke-width="2.5"/>
    <path d="M96 105 L102 96 L108 105 L102 114 Z" fill="#C0392B" stroke-width="2"/>
    <path d="M60 86 C87 92 123 88 151 80 M72 142 L129 142" fill="none" stroke="#F5EDD6" stroke-width="2" opacity="0.55"/>
  </g>
</svg>
