# =============================================================================
#  Graphe de Connaissances — "L'Arbre des Savoirs" (V2 — Jeu de scène interactif)
#
#  Format standardisé (Framework contributif). Éditable par des non-développeurs.
#
#  Deux sections :
#    - nodes    : entités (matériaux, outils, savoir-faire, concepts)
#                 champs requis : id, label, type, description, emoji
#    - recipes  : recettes de transformation jouées dans une SCÈNE INTERACTIVE
#                 champs requis : id, titre, metier, ingredients, resultat,
#                                 scenario (background, elements, steps)
#
#  Bloc scenario (moteur de scène) :
#    background : clé de décor (-> dégradé CSS côté frontend)
#    avatar     : emoji de l'enfant dans la scène
#    elements   : objets présents, id unique + emoji + type
#                 types : "draggable" (saisissable) | "dropzone" (cible de dépôt)
#                 | "static" (décor immobile)
#    steps      : étapes séquentielles (au moins 2)
#      - instruction_tts   : consigne lue au début de l'étape
#      - action_attendue   : { type: drag_and_drop | click, source, target }
#                            source/target référencent des ids d'elements
#      - success_tts       : félicitation lue quand l'action est validée
# =============================================================================

# -----------------------------------------------------------------------------
# NŒUDS
# -----------------------------------------------------------------------------
nodes:
  # --- Chaîne du métal -------------------------------------------------------
  - id: minerai_fer
    label: "Minerai de fer"
    type: materiau
    emoji: "🪨"
    description: "Roche rougeâtre tirée de la terre, qui contient le fer caché à l'intérieur."

  - id: charbon
    label: "Charbon"
    type: materiau
    emoji: "⚫"
    description: "Roche noire qui brûle très longtemps et dégage une grande chaleur."

  - id: chaleur
    label: "Chaleur extrême"
    type: concept
    emoji: "🔥"
    description: "Une température si élevée qu'elle peut faire fondre la roche et transformer les matériaux."

  - id: lingot_acier
    label: "Lingot d'acier"
    type: materiau
    emoji: "🧱"
    description: "Bloc de métal brillant et solide, obtenu en purifiant le minerai de fer."

  - id: outil_acier
    label: "Outil en acier"
    type: objet
    emoji: "⚔️"
    description: "Un objet utile forgé dans le métal, par exemple un marteau ou une lame."

  - id: epee_forgee
    label: "Épée du chevalier"
    type: objet
    emoji: "⚔️"
    description: "Une lame brillante forgée dans l'acier, trempée dans l'eau pour être solide et tranchante."

  # --- Chaîne du bois --------------------------------------------------------
  - id: bois_brut
    label: "Tronc d'arbre"
    type: materiau
    emoji: "🪵"
    description: "Le grand tronc vert d'un arbre abattu, encore couvert d'écorce."

  - id: planche_bois
    label: "Planche de bois"
    type: materiau
    emoji: "🟫"
    description: "Une planche lisse et droite, obtenue en découpant le tronc d'arbre."

  - id: clou_fer
    label: "Clou en fer"
    type: objet
    emoji: "📌"
    description: "Petite tige de métal pointue qui sert à assembler le bois."

  - id: roue_bois
    label: "Roue en bois"
    type: objet
    emoji: "🛞"
    description: "Un cercle de bois qui tourne et permet aux choses de rouler."

  - id: charrette
    label: "Charrette"
    type: objet
    emoji: "🛒"
    description: "Un petit véhicule à roues pour transporter de lourdes charges."

# -----------------------------------------------------------------------------
# RECETTES (scènes interactives)
# -----------------------------------------------------------------------------
recipes:
  # === Chaîne métal : minerai -> acier -> épée (v2.0 enluminure) ==============
  # Chaîne causale : fondeur_naissance_acier produit le lingot d'acier qui sert
  # de matière première à forgeron_epee. Le champ prerequis verrouille la 2e
  # recette jusqu'à completion de la 1re (géré côté frontend).
  - id: fondeur_naissance_acier
    titre: "La Naissance de l'Acier"
    metier: "Fondeur"
    ordre: 1
    prerequis: null
    ingredients:
      - id: minerai_fer
        quantite: 1
      - id: charbon
        quantite: 1
    resultat:
      - id: lingot_acier
    scenario:
      background: "fondeur_bg_atelier"
      avatar: "👧"
      elements:
        # Dropzones (pièces fixes du décor)
        - { id: four_haut_fourneau, emoji: "🔥", asset: "v2_bg_fondeur", type: "dropzone" }
        - { id: moule_lingot,       emoji: "🧱", asset: "v2_prop_moule_lingot", type: "dropzone" }
        - { id: zone_livraison,     emoji: "📦", asset: "v2_result_lingot_acier", type: "dropzone" }
        # Draggables (props à saisir)
        - { id: minerai_fer,    emoji: "🪨", asset: "v2_prop_minerai_fer",  type: "draggable" }
        - { id: charbon,        emoji: "⚫", asset: "v2_prop_charbon",      type: "draggable" }
        - { id: acier_liquide,  emoji: "🧪", asset: "v2_prop_acier_liquide", type: "draggable" }
        - { id: lingot_refroidi, emoji: "🧱", asset: "v2_result_lingot_acier", type: "draggable" }
      steps:
        - id: 1
          instruction_tts: "Mets le minerai de fer dans le grand four !"
          action_attendue: { type: "drag_and_drop", source: "minerai_fer", target: "four_haut_fourneau" }
          success_tts: "Bravo ! Le minerai chauffe dans le fourneau."
        - id: 2
          instruction_tts: "Ajoute le charbon pour faire monter le feu !"
          action_attendue: { type: "drag_and_drop", source: "charbon", target: "four_haut_fourneau" }
          success_tts: "Super ! Le feu est très très chaud maintenant."
        - id: 3
          instruction_tts: "Verse l'acier liquide dans le moule !"
          action_attendue: { type: "drag_and_drop", source: "acier_liquide", target: "moule_lingot" }
          success_tts: "Parfait ! L'acier coule dans le moule."
        # Étape 4 du manifest (click moule) -> convertie en drag : on récupère
        # le lingot refroidi et on le dépose sur la zone de livraison.
        - id: 4
          instruction_tts: "L'acier a refroidi ! Récupère le beau lingot et dépose-le sur la table !"
          action_attendue: { type: "drag_and_drop", source: "lingot_refroidi", target: "zone_livraison" }
          success_tts: "Incroyable ! Tu as fabriqué un lingot d'acier !"

  - id: forgeron_epee
    titre: "L'Épée du Chevalier"
    metier: "Forgeron"
    ordre: 2
    prerequis: "fondeur_naissance_acier"
    ingredients:
      - id: lingot_acier
        quantite: 1
      - id: chaleur
        quantite: 1
    resultat:
      - id: epee_forgee
    scenario:
      background: "forgeron_bg_atelier"
      avatar: "👧"
      elements:
        # Dropzones (pièces fixes du décor)
        - { id: forge_feu,   emoji: "🔥", asset: "v2_bg_forgeron", type: "dropzone" }
        - { id: avatar_zone, emoji: "🧒", asset: "v2_prop_tablier", type: "dropzone" }
        - { id: metal_chaud, emoji: "⚙️", asset: "v2_prop_metal_chaud", type: "dropzone" }
        - { id: enclume,     emoji: "⚒️", asset: "v2_prop_metal_chaud", type: "dropzone" }
        - { id: seau_eau,    emoji: "🪣", asset: "v2_prop_seau_eau", type: "dropzone" }
        # Draggables (props à saisir)
        - { id: lingot_acier, emoji: "🧱", asset: "v2_result_lingot_acier", type: "draggable" }
        - { id: tablier,      emoji: "🥋", asset: "v2_prop_tablier",   type: "draggable" }
        - { id: gants,        emoji: "🧤", asset: "v2_prop_gants",     type: "draggable" }
        - { id: tenailles,    emoji: "🔧", asset: "v2_prop_tenailles", type: "draggable" }
        - { id: marteau,      emoji: "🔨", asset: "v2_prop_marteau",   type: "draggable" }
        - { id: metal_chaud_prop, emoji: "🔥", asset: "v2_prop_metal_chaud", type: "draggable" }
      steps:
        - id: 1
          instruction_tts: "Mets ton tablier de forgeron pour te protéger !"
          action_attendue: { type: "drag_and_drop", source: "tablier", target: "avatar_zone" }
          success_tts: "Parfait, tu es bien protégé !"
        - id: 2
          instruction_tts: "Enfile tes gants de forge pour tes mains !"
          action_attendue: { type: "drag_and_drop", source: "gants", target: "avatar_zone" }
          success_tts: "Bien ! Tes mains sont protégées de la chaleur."
        - id: 3
          instruction_tts: "Mets le lingot d'acier dans le feu pour le chauffer !"
          action_attendue: { type: "drag_and_drop", source: "lingot_acier", target: "forge_feu" }
          success_tts: "Le lingot rougeoie, il est prêt à être forgé !"
        - id: 4
          instruction_tts: "Saisis le métal chaud avec les tenailles !"
          action_attendue: { type: "drag_and_drop", source: "tenailles", target: "metal_chaud" }
          success_tts: "Attention c'est chaud ! Tu le tiens bien."
        # Étape 5 du manifest (click marteau ×5) -> convertie en drag unique
        # symbolique (le moteur n'a pas de compteur de répétitions).
        - id: 5
          instruction_tts: "Frappe le métal sur l'enclume avec le marteau, fort et longtemps !"
          action_attendue: { type: "drag_and_drop", source: "marteau", target: "enclume" }
          success_tts: "Toc toc toc ! La lame prend forme !"
        - id: 6
          instruction_tts: "Trempe l'épée dans l'eau pour la durcir !"
          action_attendue: { type: "drag_and_drop", source: "metal_chaud_prop", target: "seau_eau" }
          success_tts: "Pshhhhh ! L'acier durcit. Ton épée est forgée !"

  # === Chaîne bois ===========================================================
  - id: recette_bucheronnage
    titre: "Le chant de la forêt"
    metier: "Bûcheron"
    ingredients:
      - id: bois_brut
        quantite: 1
    resultat:
      - id: planche_bois
    scenario:
      background: "foret"
      avatar: "👧"
      elements:
        - { id: chapeau, emoji: "🧢", asset: "avatar_chapeau_bucheron", type: "draggable" }
        - { id: zone_preparation, emoji: "🧺", asset: "zone_preparation", type: "dropzone" }
        - { id: tronc, emoji: "🪵", asset: "prop_tronc", type: "both" }
        - { id: billot, emoji: "🪵", asset: "zone_billot", type: "dropzone" }
        - { id: hache, emoji: "🪓", asset: "prop_hache", type: "draggable" }
        - { id: scie, emoji: "🪚", asset: "prop_scie", type: "draggable" }
        - { id: planche, emoji: "🟫", asset: "result_planche", type: "static" }
      steps:
        - id: 1
          instruction_tts: "Avant d'entrer dans la forêt, mets ton chapeau de bûcheron pour protéger ta tête !"
          action_attendue: { type: "drag_and_drop", source: "chapeau", target: "zone_preparation" }
          success_tts: "Super ! Avec ton chapeau, tu ressembles à un vrai bûcheron. En route !"
        - id: 2
          instruction_tts: "Pose le grand tronc d'arbre sur le billot pour bien le tenir !"
          action_attendue: { type: "drag_and_drop", source: "tronc", target: "billot" }
          success_tts: "Très bien ! Le tronc est bien calé, prêt à être travaillé."
        - id: 3
          instruction_tts: "Prends la hache et frappe le tronc pour le fendre !"
          action_attendue: { type: "drag_and_drop", source: "hache", target: "tronc" }
          success_tts: "Chic ! La hache fend le bois avec un grand bruit satisfaisant."
        - id: 4
          instruction_tts: "Utilise maintenant la scie pour couper de belles planches bien droites !"
          action_attendue: { type: "drag_and_drop", source: "scie", target: "tronc" }
          success_tts: "Génial ! La scie découpe des planches lisses et parfaitement droites. Tu es un vrai bûcheron !"

  - id: recette_charronnage
    titre: "La charrette qui roule"
    metier: "Charron"
    prerequis: "recette_bucheronnage"
    ingredients:
      - id: planche_bois
        quantite: 1
      - id: clou_fer
        quantite: 1
      - id: roue_bois
        quantite: 1
    resultat:
      - id: charrette
    scenario:
      background: "atelier_charron"
      avatar: "👧"
      elements:
        - { id: gants, emoji: "🧤", asset: "avatar_gants", type: "draggable" }
        - { id: zone_preparation, emoji: "🧺", asset: "zone_preparation", type: "dropzone" }
        - { id: planche, emoji: "🟫", asset: "prop_planche_bois", type: "draggable" }
        - { id: clou, emoji: "📌", asset: "prop_clou", type: "draggable" }
        - { id: roue, emoji: "🛞", asset: "prop_roue_bois", type: "draggable" }
        - { id: chassis, emoji: "🛒", asset: "zone_chassis_charrette", type: "dropzone" }
        - { id: marteau_charron, emoji: "🔨", asset: "prop_marteau", type: "draggable" }
      steps:
        - id: 1
          instruction_tts: "Pour construire sans te faire mal, commence par mettre tes gants de travail !"
          action_attendue: { type: "drag_and_drop", source: "gants", target: "zone_preparation" }
          success_tts: "Très bien ! Tes mains sont protégées des échardes et des clous. C'est parti !"
        - id: 2
          instruction_tts: "Pose les planches de bois sur le chassis pour commencer la charrette !"
          action_attendue: { type: "drag_and_drop", source: "planche", target: "chassis" }
          success_tts: "Bien joué ! Les planches forment le plancher de la charrette."
        - id: 3
          instruction_tts: "Prends les clous et frappe-les avec le marteau pour tout assembler solidement !"
          action_attendue: { type: "drag_and_drop", source: "marteau_charron", target: "chassis" }
          success_tts: "Cloc, cloc ! Les clous enfoncés maintiennent les planches. Quel travail soigné !"
        - id: 4
          instruction_tts: "Fixe les roues de bois pour que la charrette puisse rouler !"
          action_attendue: { type: "drag_and_drop", source: "roue", target: "chassis" }
          success_tts: "Et voilà ! Les roues sont en place. La charrette est prête à rouler. Tu es un excellent charron !"
